<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cinta: {
                            lembut: '#FFF5F8',
                            merahMuda: '#FFD6E0',
                            merahSedang: '#FF8FA3',
                            merahTua: '#E63963',
                            unguMuda: '#F0E6FF',
                            teks: '#4A235A'
                        }
                    },
                    fontFamily: {
                        romantis: ['"Great Vibes"', 'cursive', 'serif'],
                        utama: ['"Inter"', 'sans-serif']
                    },
                    screens: {
                        'xs': '360px',
                        'sm': '480px',
                        'md': '768px',
                        'lg': '1024px'
                    }
                }
            }
        }

    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFF5F8 0%, #F0E6FF 100%);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .font-romantis {
            font-family: 'Great Vibes', cursive;
        }

        /* === ANIMASI HATI BERDETAK === */
        .hati {
            display: inline-block;
            width: 24px;
            height: 20px;
            position: relative;
            margin: 0 6px;
        }
        .hati::before,
        .hati::after {
            content: '';
            position: absolute;
            top: 0;
            width: 12px;
            height: 18px;
            background: #E63963;
            border-radius: 50px 50px 0 0;
        }
        .hati::before {
            left: 12px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .hati::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        .animasi-detak {
            animation: detak 1.6s ease-in-out infinite;
        }
        @keyframes detak {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* === ANIMASI MASUK HALAMAN === */
        .muncul {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease-out forwards;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* === ANIMASI LAMAN MUNCUL AWAL === */
        .muncul-laman {
            animation: munculLaman 1.2s ease-out forwards;
        }
        @keyframes munculLaman {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* === EMOTIKON CINTA YANG MENGAMBANG === */
        .emot-cinta {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            font-size: 1.25rem;
            animation: naikMengambang linear forwards;
        }
        @keyframes naikMengambang {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            20% {
                transform: translateY(-20vh) rotate(15deg) scale(1.1);
            }
            40% {
                transform: translateY(-40vh) rotate(-10deg) scale(1);
            }
            60% {
                transform: translateY(-60vh) rotate(8deg) scale(1.05);
            }
            80% {
                opacity: 0.7;
                transform: translateY(-80vh) rotate(-5deg) scale(0.95);
            }
            100% {
                opacity: 0;
                transform: translateY(-110vh) rotate(10deg) scale(0.8);
            }
        }

        /* === BERKEDIPAN LEMBUT === */
        .berkedip {
            animation: berkedip 2.5s ease-in-out infinite;
        }
        @keyframes berkedip {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* === GAYA ITEM FOTO & VIDEO === */
        .media-item {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            position: relative;
        }
        .media-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 18px 30px rgba(230, 57, 99, 0.25);
        }
        .media-item img,
        .media-item video {
            transition: transform 0.5s ease;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-item:hover img,
        .media-item:hover video {
            transform: scale(1.12);
        }

        /* === IKON PUTAR DI VIDEO === */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #E63963;
            z-index: 2;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(230, 57, 99, 0.2);
        }
        .media-item:hover .play-icon {
            background: #fff;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 6px 16px rgba(230, 57, 99, 0.3);
        }

        /* === MODAL LAYAR PENUH === */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: munculModal 0.3s ease-out forwards;
        }
        @keyframes munculModal {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .modal-konten {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            animation: skalaMuncul 0.4s ease-out forwards;
        }
        @keyframes skalaMuncul {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tutup {
            position: absolute;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10000;
        }
        .tutup:hover {
            color: #FF8FA3;
            transform: scale(1.2);
        }

        /* === RESPONSIF NAVIGASI === */
        @media (max-width: 768px) {
            .nav-menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem;
            }
            .nav-menu a {
                font-size: 0.75rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>

    <!-- Bagian Judul -->

            <p class="text-base sm:text-lg text-cinta-teks/80 max-w-xl mx-auto mb-4">

            <!-- Tombol Link Google Drive -->
            <a href="https://drive.google.com/drive/folders/1o4oU2Os7R3-pA1xCHw_3313N1jWUFfwi?usp=sharing" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 bg-cinta-merahSedang hover:bg-cinta-merahTua text-white px-5 py-2 rounded-full text-sm font-medium transition-all shadow hover:shadow-lg hover:scale-105 active:scale-95">

    <!-- Bagian Galeri Foto & Video -->
    <section class="pb-20 pt-8">

            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5 md:gap-6">
                <!-- === FOTO === -->

                <div class="media-item muncul bg-white p-3 rounded-2xl shadow-md border border-cinta-merahMuda/40" onclick="bukaMedia('foto', 'assets/images/f1 (3).jpeg')" style="animation-delay: 0.4s">

                    <img src="assets/images/bakso.jpg" alt="Kenangan 5" class="h-44 sm:h-48 rounded-xl">
                </div>
                <!-- Foto 6 -->
                <div class="media-item muncul bg-white p-3 rounded-2xl shadow-md border border-cinta-merahMuda/40" onclick="bukaMedia('foto', 'assets/images/foto4.jpg')" style="animation-delay: 0.7s">
                    <img src="assets/images/foto4.jpg" alt="Kenangan 6" class="h-44 sm:h-48 rounded-xl">

                <!-- === VIDEO === -->
                <!-- Video 1 -->
                <div class="media-item muncul bg-white p-3 rounded-2xl shadow-md border border-cinta-merahMuda/40" onclick="bukaMedia('video', 'assets/images/VID-20260630-WA0347.mp4')" style="animation-delay: 0.8s">

    <!-- Modal Layar Penuh -->
    <div id="modalLayar" class="modal" onclick="tutupModal()">
        <span class="tutup">&times;</span>
        <img id="gambarPenuh" class="modal-konten" alt="Tampilan Penuh" style="display: none;">
        <video id="videoPenuh" class="modal-konten" controls autoplay alt="Tampilan Video" style="display: none;"></video>
    </div>

    <!-- Script -->
    <script>
        const modal = document.getElementById('modalLayar');
        const imgPenuh = document.getElementById('gambarPenuh');
        const vidPenuh = document.getElementById('videoPenuh');

        // === DAFTAR EMOTIKON CINTA ===
        const daftarEmot = ['❤️', '💕', '💗', '💖', '💘', '💝', '🥰', '😍', '💑', '💞', '🌹', '✨', '💫', '⭐', '🦋', '🌸', '💐'];

        // === FUNGSI BUAT EMOTIKON TERBANG ===
        function buatEmotTerbang() {
            const emot = document.createElement('span');
            emot.className = 'emot-cinta';
            emot.innerText = daftarEmot[Math.floor(Math.random() * daftarEmot.length)];
            
            // Posisi acak di bawah layar
            const posisiX = Math.random() * 90 + 5; // 5% - 95%
            const ukuran = Math.random() * 1 + 0.8; // 0.8rem - 1.8rem
            const durasi = Math.random() * 4 + 5; // 5 - 9 detik
            const mundur = Math.random() * 2; // penundaan
            
            emot.style.left = `${posisiX}%`;
            emot.style.bottom = '-50px';
            emot.style.fontSize = `${ukuran}rem`;
            emot.style.animationDuration = `${durasi}s`;
            emot.style.animationDelay = `${mundur}s`;
            
            document.body.appendChild(emot);
            
            // Hapus setelah selesai
            setTimeout(() => emot.remove(), (durasi + mundur) * 1000);
        }

        // === JALANKAN EMOT TERBANG SAAT LAMAN DIBUKA ===
        for (let i = 0; i < 12; i++) {
            setTimeout(buatEmotTerbang, i * 250);
        }
        // Lanjutkan secara berkala
        setInterval(buatEmotTerbang, 1200);

        // Fungsi buka media (foto atau video)
        function bukaMedia(jenis, sumber) {
            // Tambah efek saat diklik
            for (let i = 0; i < 5; i++) {
                setTimeout(buatEmotTerbang, i * 100);
            }
            
            // Reset tampilan sebelumnya
            imgPenuh.style.display = 'none';
            vidPenuh.style.display = 'none';
            vidPenuh.pause();
            
            if (jenis === 'foto') {
                imgPenuh.src = sumber;
                imgPenuh.style.display = 'block';
            } else if (jenis === 'video') {
                vidPenuh.src = sumber;
                vidPenuh.style.display = 'block';
            }
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // Tutup modal
        function tutupModal() {
            modal.style.display = 'none';
            vidPenuh.pause();
            document.body.style.overflow = 'auto';
        }

        // Tutup modal dengan tombol ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') tutupModal();
        });
    </script>

    <!-- Kaki Halaman -->
    <footer class="text-center pb-6 text-xs sm:text-sm text-cinta-teks/70 muncul" style="animation-delay: 1s">

    </footer>
