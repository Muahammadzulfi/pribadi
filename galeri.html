    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFF5F8 0%, #F0E6FF 100%);
            min-height: 100vh;
            line-height: 1.6;
        }

        .font-romantis {
            font-family: 'Great Vibes', cursive;
        }

        /* Animasi Hati Berdetak */
        .hati {
            display: inline-block;
            width: 24px;
            height: 20px;
            position: relative;
            margin: 0 6px;
        }
        .hati::before,
        .hati::after {
            content: '';
            position: absolute;
            top: 0;
            width: 12px;
            height: 18px;
            background: #E63963;
            border-radius: 50px 50px 0 0;
        }
        .hati::before {
            left: 12px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .hati::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        .animasi-detak {
            animation: detak 1.6s ease-in-out infinite;
        }
        @keyframes detak {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Animasi Muncul */
        .muncul {
            opacity: 0;
            transform: translateY(25px);
            animation: fadeUp 0.8s ease-out forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gaya Item Foto & Video */
        .media-item {
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }
        .media-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(230, 57, 99, 0.2);
        }
        .media-item img,
        .media-item video {
            transition: transform 0.4s ease;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-item:hover img,
        .media-item:hover video {
            transform: scale(1.08);
        }

        /* Ikon Putar di Video */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #E63963;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .media-item:hover .play-icon {
            background: #fff;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Modal Layar Penuh */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-konten {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
        .tutup {
            position: absolute;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10000;
        }
        .tutup:hover {
            color: #FF8FA3;
            transform: scale(1.1);
        }

        /* Responsif Navigasi */
        @media (max-width: 768px) {
            .nav-menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem;
            }
            .nav-menu a {
                font-size: 0.75rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>

    <!-- Bagian Judul -->

    <!-- Bagian Galeri Foto & Video -->

    <!-- Modal Layar Penuh -->
    <div id="modalLayar" class="modal" onclick="tutupModal()">
        <span class="tutup">&times;</span>
        <img id="gambarPenuh" class="modal-konten" alt="Tampilan Penuh" style="display: none;">
        <video id="videoPenuh" class="modal-konten" controls autoplay alt="Tampilan Video" style="display: none;"></video>
    </div>

    <!-- Script -->
    <script>
        const modal = document.getElementById('modalLayar');
        const imgPenuh = document.getElementById('gambarPenuh');
        const vidPenuh = document.getElementById('videoPenuh');

        // Fungsi buka media (foto atau video)
        function bukaMedia(jenis, sumber) {
            // Reset tampilan sebelumnya
            imgPenuh.style.display = 'none';
            vidPenuh.style.display = 'none';
            vidPenuh.pause();

            if (jenis === 'foto') {
                imgPenuh.src = sumber;
                imgPenuh.style.display = 'block';
            } else if (jenis === 'video') {
                vidPenuh.src = sumber;
                vidPenuh.style.display = 'block';
            }

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // Tutup modal
        function tutupModal() {
            modal.style.display = 'none';
            vidPenuh.pause();
            document.body.style.overflow = 'auto';
        }

        // Tutup modal dengan tombol ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') tutupModal();
        });
    </script>
